name: azure-cert-gui-deploy-$(Date:yyyyMMdd).$(Rev:r)

# Deployment is intentionally separate from CI. Create a second Azure DevOps
# pipeline for this file and keep it manual-only. The source pipeline resource
# refers to the CI pipeline by its Azure DevOps definition name.
trigger: none
pr: none

resources:
  pipelines:
    - pipeline: ci
      source: azure-cert-gui
      trigger: none

parameters:
  - name: deployProduction
    displayName: Enable production deployment
    type: boolean
    default: false

variables:
  - group: azure-cert-gui-production

  # Keep deployment routing and environment details in protected Azure DevOps
  # configuration. These generic names must not be replaced with a machine
  # name in this public repository.
  - name: windowsAgentPool
    value: "azure-cert-gui-onprem"
  - name: windowsEnvironment
    value: "Azure-Cert-GUI-Production"
  - name: artifactName
    value: "azure-cert-gui"
  - name: windowsInstallRoot
    value: "C:\\ProgramData\\AzureCertGui"
  - name: windowsListenHost
    value: "127.0.0.1"
  - name: windowsPort
    value: "3000"
  - name: windowsTaskName
    value: "AzureCertGui"
  - name: windowsSyncTime
    value: "07:30"
  - name: windowsAzureCliLoginMode
    value: "service-principal-certificate"
  - name: windowsCertificateSecureFile
    value: "azure-cert-gui-production.pem"
  - name: windowsUseManagedIdentity
    value: "false"
  - name: windowsRunInitialSync
    value: "false"

stages:
  - stage: DeployWindowsServer
    displayName: Deploy on approved Windows target
    condition: and(succeeded(), ${{ eq(parameters.deployProduction, true) }}, eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - deployment: DeployWindowsServer
        displayName: Deploy Azure Cert GUI locally on the approved target
        pool:
          name: $(windowsAgentPool)
        environment: $(windowsEnvironment)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - download: ci
                  artifact: azure-cert-gui

                - task: DownloadSecureFile@1
                  name: azureCertificate
                  displayName: Download protected Azure certificate
                  inputs:
                    secureFile: "$(windowsCertificateSecureFile)"

                - task: PowerShell@2
                  displayName: Deploy, migrate, schedule, and smoke test locally
                  inputs:
                    targetType: inline
                    script: |
                      $ErrorActionPreference = "Stop"
                      $artifactPath = Join-Path (Join-Path "$(Pipeline.Workspace)" "ci") "$(artifactName)"
                      $certificatePath = "$(azureCertificate.secureFilePath)"
                      $deployScript = Join-Path $artifactPath "scripts\\deploy-windows-server.ps1"

                      $env:AZURE_TENANT_ID = '$(AZURE_TENANT_ID)'
                      $env:AZURE_SUBSCRIPTION_IDS = '$(AZURE_SUBSCRIPTION_IDS)'
                      $env:AZURE_KEYVAULT_RESOURCE_IDS = '$(AZURE_KEYVAULT_RESOURCE_IDS)'
                      $env:AZURE_CLI_PATH = '$(AZURE_CLI_PATH)'
                      $env:AZURE_CERT_GUI_AZ_LOGIN_MODE = '$(windowsAzureCliLoginMode)'
                      $env:AZURE_CERT_GUI_SP_APP_ID = '$(AZURE_CERT_GUI_SP_APP_ID)'
                      $env:AZURE_CERT_GUI_SP_CERTIFICATE_PATH = $certificatePath
                      $env:AZURE_GRAPH_INCLUDE_OWNERS = '$(AZURE_GRAPH_INCLUDE_OWNERS)'
                      $env:AZURE_GRAPH_INCLUDE_OWNER_DIRECTORY = '$(AZURE_GRAPH_INCLUDE_OWNER_DIRECTORY)'
                      $env:AZURE_KEYVAULT_INCLUDE_VERSIONS = '$(AZURE_KEYVAULT_INCLUDE_VERSIONS)'
                      $env:AZURE_CERT_GUI__AUTH__MODE = 'oidc'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__AUTHORITY = '$(AZURE_CERT_GUI__AUTH__OIDC__AUTHORITY)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__CLIENTID = '$(AZURE_CERT_GUI__AUTH__OIDC__CLIENTID)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__CLIENTSECRET = '$(AZURE_CERT_GUI__AUTH__OIDC__CLIENTSECRET)'
                      $env:AZURE_CERT_GUI__AUTH__COOKIESECRET = '$(AZURE_CERT_GUI__AUTH__COOKIESECRET)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__ROLESCLAIMTYPE = '$(AZURE_CERT_GUI__AUTH__OIDC__ROLESCLAIMTYPE)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__VIEWERGROUPS = '$(AZURE_CERT_GUI__AUTH__OIDC__VIEWERGROUPS)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__VIEWERGROUPS__0 = '$(AZURE_CERT_GUI__AUTH__OIDC__VIEWERGROUPS__0)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__OPERATORGROUPS = '$(AZURE_CERT_GUI__AUTH__OIDC__OPERATORGROUPS)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__OPERATORGROUPS__0 = '$(AZURE_CERT_GUI__AUTH__OIDC__OPERATORGROUPS__0)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__ADMINGROUPS = '$(AZURE_CERT_GUI__AUTH__OIDC__ADMINGROUPS)'
                      $env:AZURE_CERT_GUI__AUTH__OIDC__ADMINGROUPS__0 = '$(AZURE_CERT_GUI__AUTH__OIDC__ADMINGROUPS__0)'
                      $env:AZURE_CERT_GUI__ROTATION__LIVEENABLED = "false"
                      $env:AZURE_CERT_GUI_MANAGED_IDENTITY_CLIENT_ID = '$(AZURE_CERT_GUI_MANAGED_IDENTITY_CLIENT_ID)'

                      try {
                        if (-not (Test-Path -LiteralPath $artifactPath)) {
                          throw "Deployment artifact was not found at $artifactPath."
                        }
                        if (-not (Test-Path -LiteralPath $certificatePath)) {
                          throw "Protected Azure certificate was not found at $certificatePath."
                        }

                        & $deployScript `
                          -ArtifactPath $artifactPath `
                          -InstallRoot "$(windowsInstallRoot)" `
                          -ListenHost "$(windowsListenHost)" `
                          -Port $(windowsPort) `
                          -TaskName "$(windowsTaskName)" `
                          -SyncTime "$(windowsSyncTime)" `
                          -AzureCliLoginMode "$(windowsAzureCliLoginMode)" `
                          -AzureCliCertificatePath $certificatePath `
                          -UseManagedIdentity ([System.Convert]::ToBoolean("$(windowsUseManagedIdentity)")) `
                          -RunInitialSync ([System.Convert]::ToBoolean("$(windowsRunInitialSync)"))
                        if ($LASTEXITCODE -ne 0) {
                          exit $LASTEXITCODE
                        }
                      } finally {
                        Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
                        Remove-Item -LiteralPath $artifactPath -Recurse -Force -ErrorAction SilentlyContinue
                      }
                    pwsh: false

                - task: PowerShell@2
                  displayName: Clean local deployment staging
                  condition: always()
                  inputs:
                    targetType: inline
                    script: |
                      $artifactPath = Join-Path (Join-Path "$(Pipeline.Workspace)" "ci") "$(artifactName)"
                      Remove-Item -LiteralPath $artifactPath -Recurse -Force -ErrorAction SilentlyContinue
                      Remove-Item -LiteralPath "$(azureCertificate.secureFilePath)" -Force -ErrorAction SilentlyContinue
                    pwsh: false
